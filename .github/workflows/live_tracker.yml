name: Shivalik Capital — Daily Live Tracker

# Runs daily at 9:30 PM UTC = 3:00 AM IST (next day)
# Also allows manual trigger from GitHub Actions tab
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live tracker
        run: python backtest/live_tracker.py

      - name: Commit updated tracking data
        run: |
          git config user.name "Soren"
          git config user.email "sorendatta7@gmail.com"
          git add backtest/live_tracking.json
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "Live tracking update -- $(date -u +'%Y-%m-%d')"
          git push
